apiVersion: v1
kind: ConfigMap
metadata:
  name: minipay-config
  namespace: minipay
data:
  DB_HOST: "minipay-db"
  DB_PORT: "5432"
  DB_NAME: "minipay"
  DB_USER: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: minipay-secrets
  namespace: minipay
type: Opaque
stringData:
  POSTGRES_PASSWORD: "replace_with_db_password"
  API_KEY: "replace_with_api_key"

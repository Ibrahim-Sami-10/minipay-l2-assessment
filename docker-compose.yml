services:
  db:
    image: postgres:16
    container_name: minipay-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: minipay
      POSTGRES_USER: minipay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minipay -d minipay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
